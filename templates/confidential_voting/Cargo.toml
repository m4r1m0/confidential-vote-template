[package]
name = "confidential_voting"
version = "0.1.0"
edition = "2024"
description = "Confidential voting template for Tari Ootle (IRV, FPTP, STV, stealth ballots, unlinkable voters)"

[package.metadata.tari-template]
tags = ["voting", "governance", "dao", "rcv", "fptp", "stv", "election", "confidential", "stealth"]
category = "governance"
documentation = "https://github.com/m4r1m0/confidential-vote-template"
homepage = "https://github.com/m4r1m0/confidential-vote-template"

[dependencies]
tari_template_lib = { version = "0.33" }
# The pure tally algorithms live in a standalone crate so the template can ship as a pure
# cdylib: with a second crate-type (rlib) present, rustc silently drops `-C lto` and the
# WASM grows ~20%. Tests link `rcv-tally` directly instead of this crate.
rcv-tally = { path = "../../tally" }

[dev-dependencies]
tari_template_test_tooling = "0.43"
[build-dependencies]
tari_ootle_template_build = "0.13"

[lib]
crate-type = ["cdylib"]
