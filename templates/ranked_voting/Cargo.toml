[package]
name = "ranked_voting"
version = "0.1.0"
edition = "2024"
description = "Confidential ranked-choice voting template for Tari Ootle (IRV, stealth ballots, unlinkable voters)"

[package.metadata.tari-template]
tags = ["voting", "governance", "dao", "rcv", "stv", "election", "confidential", "stealth"]
category = "governance"
documentation = "https://github.com/m4r1m0/confidential-rcv-template"
homepage = "https://github.com/m4r1m0/confidential-rcv-template"

[dependencies]
tari_template_lib = { version = "0.31" }
# The pure tally algorithms live in a standalone crate so the template can ship as a pure
# cdylib: with a second crate-type (rlib) present, rustc silently drops `-C lto` and the
# WASM grows ~20%. Tests link `rcv-tally` directly instead of this crate.
rcv-tally = { path = "../../tally" }

[dev-dependencies]
tari_template_test_tooling = "0.40"
# Pin wasmer to 7.3.0: `tari_engine` (upstream) declares `wasmer ^7.1.0`, but wasmer 7.4.0
# removed an API the engine uses, which breaks `cargo test` on a fresh resolve. wasmer 7.3.0
# pins its whole family internally (`=7.3.0`), so these two exact pins force the engine onto
# the working version. Remove both once tari-ootle tightens its wasmer constraint.
wasmer = "=7.3.0"
wasmer-middlewares = "=7.3.0"

[build-dependencies]
tari_ootle_template_build = "0.11"

[lib]
crate-type = ["cdylib"]
