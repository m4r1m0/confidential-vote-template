[workspace]
members = ["tally", "templates/confidential_voting"]
# The integration client still targets the 0.43 SDK crates, whose tari_hashing pin conflicts
# with the 0.49 engine. Build it on its own until it is ported.
exclude = ["client/integration"]
resolver = "2"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2

